# Aurey wallet MCP — minimal standalone config (see docs/setup.md)
# Hermes: prefer `uv run aurey-setup` — writes ~/.hermes/.env and sets alchemy_secret_path below.

[oneclaw]
vault_id = ""
# Agent API key (ocv_…): AUREY_ONECLAW_VAULT_API_KEY in MCP host env (Hermes ~/.hermes/.env).
agent_id = ""

[wallet]
# evm_signing_mode defaults to oneclaw_intents in aurey-wallet-mcp (no env required).

[providers]
# Preferred: store Alchemy in 1Claw at this path (agent policy must allow read).
alchemy_secret_path = "api-keys/alchemy"
# Optional plaintext override (not recommended for Hermes MCP env):
# alchemy_api_key = ""
# Optional: Zerion in 1Claw at api-keys/zerion (Mini App portfolio; aurey-setup sets this when provided):
# zerion_api_secret_path = "api-keys/zerion"
# zerion_api_key = ""

[routing]
# Default in code: https://aurey-route-builder-production.up.railway.app (25 bps integrator fee).
# Set empty to quote LiFi directly (no Aurey fee):
# route_builder_url = ""
# route_builder_api_key = ""
# Optional override for bundled LiFi shards (default: package aurey/data/lifi_tokens/):
# lifi_tokens_path = "/path/to/lifi_tokens"   # directory of {chain_id}.json, or legacy monolith file
# bundled_lifi_tokens_enabled = false

[dashboard]
# Local portfolio UI at http://127.0.0.1:8765/ while MCP runs (aurey-setup enables by default).
enabled = true
host = "127.0.0.1"
# host = "0.0.0.0"  # LAN / other devices on your network — set auth_token when not on loopback
port = 8765
# auth_token = ""
# Live portfolio charts need optional Zerion: api-keys/zerion + zerion_api_secret_path in [providers].

[autonomy]
# policy_path = "~/.aurey/autonomy_policy.json"
# x402_url = "http://127.0.0.1:8092"
