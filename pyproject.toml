[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurey-wallet-mcp"
version = "0.1.1"
description = "Self-hosted Aurey wallet tools as an MCP server (1Claw custody, EVM swaps, local dashboard)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Agentic Pantheon" }]
keywords = ["mcp", "wallet", "1claw", "evm", "hermes", "intents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "mcp>=1.6",
    "pydantic-settings>=2",
    "tomli>=2; python_version < '3.11'",
    "web3>=6.11.0",
]

[project.urls]
Homepage = "https://agentic-pantheon.github.io/aurey-mcp/"
Documentation = "https://agentic-pantheon.github.io/aurey-mcp/install.html"
Repository = "https://github.com/agentic-pantheon/aurey-mcp"
Issues = "https://github.com/agentic-pantheon/aurey-mcp/issues"

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
route-builder = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
hermes = [
    "pyyaml>=6",
]

[project.scripts]
aurey-wallet-mcp = "aurey_wallet_mcp.server:main"
aurey-route-builder = "aurey_route_builder.app:main"
aurey-hermes-install = "aurey_wallet_mcp.hermes_install:main"
aurey-setup = "aurey_wallet_mcp.setup:main"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aurey = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
